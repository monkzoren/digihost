# The SpacetimeDB module is deliberately NOT a member: it compiles to
# wasm32-unknown-unknown and must not share feature resolution with the
# native server and agent binaries.
[workspace]
resolver = "2"
members = ["crates/agent", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
spacetimedb-sdk = "=2.0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
